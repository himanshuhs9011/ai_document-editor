<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>AI Document Editor</title>
  <style>
    :root { color-scheme: light dark; --paper: #faf8f4; --ink: #2a2f3a; --soft: #5d6370; --accent: #22579b; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1c1f26; --ink: #ecebe7; --soft: #b4b3ad; --accent: #8db4ea; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 26rem; padding: 2rem; }
    h1 { margin: 0 0 .5rem; font: 600 1.375rem/1.25 Georgia, serif; }
    p { margin: 0 0 1.5rem; color: var(--soft); }
    button { height: 36px; padding: 0 1rem; border: 0; border-radius: 6px; background: var(--accent); color: var(--paper);
      font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach AI Document Editor</h1>
    <p>The app needs an internet connection. Check that you're online, then try again.</p>
    <button id="retry" type="button" autofocus>Try again</button>
  </main>
  <script>
    document.getElementById('retry').addEventListener('click', () => {
      location.href = new URLSearchParams(location.search).get('url');
    });
  </script>
</body>
</html>
