<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>AI Document Editor</title>
  <style>
    :root { color-scheme: light dark; --paper: #faf8f4; --ink: #2a2f3a; --soft: #5d6370; --accent: #22579b; }
    @media (prefers-color-scheme: dark) { :root { --paper: #1c1f26; --ink: #ecebe7; --soft: #b4b3ad; --accent: #8db4ea; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 28rem; padding: 2rem; }
    h1 { margin: 0 0 .5rem; font: 600 1.375rem/1.25 Georgia, serif; }
    p { margin: 0 0 1.5rem; color: var(--soft); }
    button { height: 36px; padding: 0 1rem; border: 0; border-radius: 6px; background: var(--accent); color: var(--paper);
      font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    [hidden] { display: none; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Starting AI Document Editor…</h1>
    <p id="message">Opening your documents.</p>
    <button id="retry" type="button" hidden>Try again</button>
  </main>
  <script>
    // The app passes its own wording; this page never loads anything from the internet.
    const query = new URLSearchParams(location.search);
    if (query.get('title')) document.getElementById('title').textContent = query.get('title');
    if (query.get('message')) document.getElementById('message').textContent = query.get('message');
    if (query.get('retry')) {
      const retry = document.getElementById('retry');
      retry.hidden = false;
      retry.focus();
      retry.addEventListener('click', () => { location.hash = 'retry'; });
    }
  </script>
</body>
</html>
